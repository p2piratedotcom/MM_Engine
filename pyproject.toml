[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "p2pirate-mm-engine"
version = "0.1.0"
description = "P2Pirate market maker engine for KDF, MEXC and Gate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Unlicense" }
dependencies = ["aiohttp>=3.10,<4"]

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7"]
release = ["pyinstaller>=6,<7"]

[project.scripts]
mm-engine = "kdf_mm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kdf_mm.exchanges" = ["config/*.json"]
