name: Wallet adapter tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wallet-adapter:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p test_wallet_adapter.py -v
