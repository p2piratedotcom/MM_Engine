name: Linux engine release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build standalone binary
        run: bash scripts/build-linux.sh
      - name: Collect bundled Python dependency notices
        run: |
          python -m pip install 'pip-licenses>=5.5,<6'
          pip-licenses --format=plain-vertical --with-license-file \
            --with-notice-file --no-license-path \
            --output-file dist/THIRD_PARTY_NOTICES.txt
          python - <<'PY'
          import sys
          from pathlib import Path
          from urllib.request import urlopen

          version = f'{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}'
          url = f'https://raw.githubusercontent.com/python/cpython/v{version}/LICENSE'
          with urlopen(url, timeout=30) as response:
              python_license = response.read(200_000).decode('utf-8')
          with Path('dist/THIRD_PARTY_NOTICES.txt').open('a', encoding='utf-8') as output:
              output.write(f'\nPython {version} — {url}\n\n{python_license}\n')
          PY
      - name: Generate compatibility manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          binary = Path('dist/mm-engine-linux-x86_64')
          manifest = {
              'schema': 1,
              'version': os.environ['RELEASE_TAG'],
              'source_commit': os.environ['SOURCE_COMMIT'],
              'platform': 'linux',
              'architecture': 'x86_64',
              'wallet_protocol': 1,
              'kdf_major_minor': '2.7',
              'binary': binary.name,
              'binary_sha256': hashlib.sha256(binary.read_bytes()).hexdigest(),
          }
          Path('dist/compatibility.json').write_text(
              json.dumps(manifest, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$RELEASE_TAG" --generate-notes \
            dist/mm-engine-linux-x86_64 dist/compatibility.json
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" dist/THIRD_PARTY_NOTICES.txt
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --draft=false
